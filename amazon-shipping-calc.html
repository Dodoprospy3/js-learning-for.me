<!DOCTYPE html> 
<html> 
    <head></head>
    <body> 
        <p>Amazon Shipping Calculator</p>
        <p>Orders under $40 = +$10 shipping.</p>
        <p>Orders over $40 = FREE shipping.</p>
        <input class="js-cost-input" placeholder="Cost of order">
        <button onclick="
            calculateTotal();
            ">Calculate</button>
        <p class="js-total-cost"></p>

        <script>

            function calculateTotal() {
                let inputElement = document.querySelector('.js-cost-input');
                let cost = inputElement.value;

                if (cost < 40) {
                    cost = cost + 10;
                }

                document.querySelector('.js-total-cost')
                    .innerHTML = `$${cost}`;
            }
            

        </script>
    </body>
</html>
