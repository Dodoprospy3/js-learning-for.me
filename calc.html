<!DOCTYPE html> 
<html> 
    <head> 
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
        <title>Calculator</title>
        <style> 
            * {
                font-family: "Space Grotesk", Arial;
                user-select: none;
            }

            .buttons-grid {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr 1fr;
            }

            body {
                margin: 0;
                margin: 0;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .container {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                background: linear-gradient(to right, rgb(92, 113, 148), rgb(128, 142, 166));
                padding: 40px;
                border-radius: 58px;
                box-shadow:
                    inset 4px 4px 13px rgba(255, 255, 255, 0.7),
                    inset 12px -8px 9px rgba(0, 0, 0, 0.15),
                    0 8px 25px rgba(0, 0, 0, 0.2);
            }

            .calc-output {
                display: block;
                background-color: rgba(204, 204, 204, 1);
                backdrop-filter: blur(20px) saturate(180%);
                border: 1px solid rgba(255, 255, 255, 0.35);
                color: black;
                padding: 28px;
                font-size: 26px;
                border-radius: 50px;
                height: 30px;
                width: 385px;
                margin-bottom: 8px;
                font-weight: 700;
                box-shadow:
                    inset 0 6px 8px rgba(255, 255, 255, 0.7),
                    inset 0 -6px 18px rgba(0, 0, 0, 0.15),
                    0 8px 25px rgba(0, 0, 0, 0.2);
            }

            .number-button {
                   width: 100px;
                   height: 97px;
                   margin: 6px;
                   padding: 0;

                   border-radius: 50%;
                   border: 1px solid rgba(255, 255, 255, 0.3);

                   background-color: rgb(173, 121, 57);
                   color: white;

                   font-size: 32px;
                   font-weight: 500;

                   cursor: pointer;
                   user-select: none;

                   transition:
                       filter 0.1s ease,
                       box-shadow 0.1s ease,
                       transform 0.1s ease;

                   box-shadow:
                       inset 3px 3px 5px rgba(255, 255, 255, 0.35),
                       inset -3px -3px 6px rgba(0, 0, 0, 0.2),
                       0 5px 15px rgba(0, 0, 0, 0.25); 
            }

            .number-button:hover {
                filter: brightness(90%);
                box-shadow:
                    inset -3px -3px 5px rgba(255, 255, 255, 0.35),
                    inset 3px 3px 6px rgba(0, 0, 0, 0.2);
            }

            .number-button:active {
                filter: brightness(70%);
            }

            .grid-box {
                display: block;
            }

            .operator-button {
                background-color: rgb(36, 50, 87);
                border: 1px solid rgba(255, 255, 255, 0.3);
                box-shadow:
                    inset 3px 3px 5px rgba(255, 255, 255, 0.35),
                    inset -3px -3px 6px rgba(0, 0, 0, 0.2),
                    0 5px 15px rgba(0, 0, 0, 0.25);
            }

            .command-button {
                background-color: rgb(36, 50, 87);
                width: 225px;
                border-radius: 90px;
                grid-column: span 2;
                border: 1px solid rgba(255, 255, 255, 0.3);
                box-shadow:
                    inset 3px 3px 5px rgba(255, 255, 255, 0.35),
                    inset -3px -3px 6px rgba(0, 0, 0, 0.2),
                    0 5px 15px rgba(0, 0, 0, 0.25);
            }
        </style>
    </head>
    <body> 
        <div class="container"> 
            <div class="calc-output js-output"> 
            </div>
            <div class="grid-box">
                <div class="buttons-grid"> 
                    <button class="number-button">9</button>
                    <button class="number-button">7</button>
                    <button class="number-button">8</button>
                    <button class="number-button operator-button">÷</button>
                    <button class="number-button">6</button>
                    <button class="number-button">5</button>
                    <button class="number-button">4</button>
                    <button class="number-button operator-button">×</button>
                    <button class="number-button">3</button>
                    <button class="number-button">2</button>
                    <button class="number-button">1</button>
                    <button class="number-button operator-button">-</button>
                    <button class="number-button command-button">=</button>
                    <button class="number-button command-button">AC</button>
                </div>
            </div>
        </div>




        <script> 
        </script>
    </body>
</html>
