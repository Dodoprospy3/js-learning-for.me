<!DOCTYPE html> 
<html> 
    <head> 
        <title>TODO List ReWrite</title>
    </head>
    <body> 
        <h2>Todo List</h2>

        <input 
        onkeydown="
            handleEnterKeyDown(event) 
        "
        class="js-todo-input" placeholder="Add Task">

        <button 
            onclick="
                updateTodoArray();
                renderTodoList();
            ">Add</button>
        <div class="js-todo-visual-list"></div>

        <script> 
            const todoList = [];
            let newTask =  '';
            
            function updateTodoArray() {
                let inputElement = document.querySelector('.js-todo-input');
                newTask = inputElement.value;
                todoList.push(newTask);
            }
           

            function handleEnterKeyDown(event) {
                if (event.key === 'Enter') {
                    updateTodoArray();
                    renderTodoList();
                }
            }
                

            function renderTodoList() {
                let todoListHTML = '';
                const outputElement = document.querySelector('.js-todo-visual-list');
                
                for (let i = 0; i < todoList.length; i++) {
                    const todo = todoList[i];
                    let renderedHTML = `<p>${todo}</p>`;
                    todoListHTML += renderedHTML;
                } 

                outputElement.innerHTML = todoListHTML;
            }
        </script>
    </body>
</html>
