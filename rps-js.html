<!DOCTYPE html>
<html>
    <head>
        <title>Rock Paper Scissors</title>
    </head>

    <body>
        <p>Rock Paper Scissors</p>

        <button onclick="
            playGame('rock');

        ">Rock</button> <button onclick="
            playGame('paper');
        ">Paper</button>

        <button onclick="
            playGame('scissors');
        ">Scissors</button>

        <p class="js-result"></p>

        <p class="js-moves"></p>

        <p class="js-score" onclick="
            updateScoreElement();
        "></p>

        <button onclick="
            score.wins = 0;
            score.losses = 0;
            score.ties = 0;
            localStorage.removeItem('score');
            updateScoreElement();
            document.querySelector('.js-result').innerHTML = '';
            document.querySelector('.js-moves').innerHTML = '';

/*
            alert(`Your Score Was Reset. 
Current Status: Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}.
            `);
*/
            ">Reset Score</button>

        <!--<button onclick="
            alert(scoreForAlert);
            ">check score</button>-->
        <!--<button onclick="
            console.log(localStorage.getItem('message'));
            ">check local storage</button>-->

        <script>
            let score = JSON.parse(localStorage.getItem('score')) || {
                    wins: 0,
                    losses: 0,
                    ties: 0
                }

            updateScoreElement();


/* uneeded if statement, leave for backup
            if (!score) {
                score = {
                    wins: 0,
                    losses: 0,
                    ties: 0
                };
            }
*/

            function playGame(playerMove) {
                const computerMove = pickComputerMove();

                let result = '';

                if (playerMove === 'scissors') {
                    if (computerMove === 'rock') {
                        result = 'You Lose.';
                    } else if (computerMove === 'paper') {
                        result = 'You Win!';
                    } else if (computerMove === 'scissors') {
                        result = 'Tie.';
                    }

                } else if (playerMove === 'paper') {
                    if (computerMove === 'rock') {
                        result = 'You Win!';
                    } else if (computerMove === 'paper') {
                        result = 'Tie.';
                    } else if (computerMove === 'scissors') {
                        result = 'You Lose.';
                    }

                } else if (playerMove === 'rock') {
                    if (computerMove === 'rock') {
                        result = 'Tie.';
                    } else if (computerMove === 'paper') {
                        result = 'You Lose.';
                    } else if (computerMove === 'scissors') {
                        result = 'You Win!';
                    }
                }

                if (result === 'You Win!') {
                    score.wins += 1;
                } else if (result === 'You Lose.') {
                    score.losses += 1;
                } else if (result === 'Tie.') {
                    score.ties += 1;
                }

                localStorage.setItem('score', JSON.stringify(score));

                document.querySelector('.js-result')
                    .innerHTML = result;

                document.querySelector('.js-moves')
                    .innerHTML = `You ${playerMove} - Computer ${computerMove}`;

                updateScoreElement();

            }


            function updateScoreElement() {
                document.querySelector('.js-score')
                    .innerHTML = `wins: ${score.wins}, losses: ${score.losses}, ties: ${score.ties}`
            }

            function pickComputerMove() {
                const randomNumber = Math.random();

                if (randomNumber >= 0 && randomNumber < 1 / 3) {
                    return 'rock';
                } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
                    return 'paper';
                } else {
                    return 'scissors';
                }
            }
        </script>
    </body>
</html>
